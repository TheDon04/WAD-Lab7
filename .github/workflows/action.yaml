name: Lab 7
#TODO The pipeline should be triggered only on push to a "test" branch
on:
  push:
    branches:
      - lab7Danial
  pull_request:
    branches:
      - lab7Danial

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run backend tests and JaCoCo report
        run: ./gradlew test jacocoTestReport
        env:
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
